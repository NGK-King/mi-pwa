<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Gestor de Password</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3f51b5">

  <!-- Librería de Cifrado (CryptoJS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
    button { background-color: #3f51b5; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .btn-delete { background-color: #e53935; margin-top: 8px; }
    .btn-backup { background-color: #2e7d32; margin-top: 5px; }
    .btn-restore { background-color: #f57c00; margin-top: 5px; }
    .card { border: 1px solid #ccc; padding: 12px; border-radius: 5px; margin-top: 10px; background-color: #f9f9f9; }
    .backup-section { background-color: #f0f4f8; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px dashed #3f51b5; }
  </style>
</head>
<body>

  <h2>🔐 Mi Gestor Seguro</h2>

  <label><strong>1. Contraseña Maestra (para cifrar/descifrar):</strong></label>
  <input type="password" id="masterKey" placeholder="Ingresa tu clave maestra">

  <hr>

  <h3>Guardar nueva clave</h3>
  <input type="text" id="site" placeholder="Sitio web o servicio (ej. Gmail)">
  <input type="password" id="password" placeholder="Contraseña a guardar">
  <button onclick="savePassword()">Guardar Contraseña</button>

  <hr>

  <h3>Mis Contraseñas Guardadas</h3>
  <button onclick="loadPasswords()">👁️ Mostrar / Descifrar Lista</button>

  <div id="passwordList"></div>

  <!-- Sección de Copia de Seguridad -->
  <div class="backup-section">
    <h3>📦 Copia de Seguridad</h3>
    <button class="btn-backup" onclick="exportBackup()">📥 Descargar Copia de Respaldo</button>
    <br><br>
    <label><strong>Restaurar desde archivo:</strong></label>
    <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importBackup(event)">
    <button class="btn-restore" onclick="document.getElementById('importFile').click()">📤 Importar Copia de Respaldo</button>
  </div>

  <script>
    // Guardar contraseña cifrada
    function savePassword() {
      const masterKey = document.getElementById('masterKey').value;
      const site = document.getElementById('site').value;
      const pass = document.getElementById('password').value;

      if (!masterKey || !site || !pass) {
        alert('Por favor completa todos los campos, incluyendo la Contraseña Maestra.');
        return;
      }

      const encryptedPass = CryptoJS.AES.encrypt(pass, masterKey).toString();
      let vault = JSON.parse(localStorage.getItem('myVault')) || [];
      
      vault.push({ site: site, pass: encryptedPass });
      localStorage.setItem('myVault', JSON.stringify(vault));

      alert('¡Contraseña cifrada y guardada con éxito!');
      document.getElementById('site').value = '';
      document.getElementById('password').value = '';
      
      loadPasswords();
    }

    // Leer y descifrar contraseñas
    function loadPasswords() {
      const masterKey = document.getElementById('masterKey').value;
      const listContainer = document.getElementById('passwordList');
      listContainer.innerHTML = '';

      if (!masterKey) {
        alert('Ingresa tu Contraseña Maestra para descifrar.');
        return;
      }

      let vault = JSON.parse(localStorage.getItem('myVault')) || [];

      if (vault.length === 0) {
        listContainer.innerHTML = '<p>No hay contraseñas guardadas.</p>';
        return;
      }

      vault.forEach((item, index) => {
        try {
          const bytes = CryptoJS.AES.decrypt(item.pass, masterKey);
          const decryptedPass = bytes.toString(CryptoJS.enc.Utf8);

          if (!decryptedPass) {
            throw new Error('Clave incorrecta');
          }

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <strong>${item.site}</strong><br>
            Password: <code>${decryptedPass}</code><br>
            <button class="btn-delete" onclick="deletePassword(${index})">🗑️ Borrar registro</button>
          `;
          listContainer.appendChild(card);
        } catch (e) {
          listContainer.innerHTML = '<p style="color:red;">Contraseña Maestra incorrecta o datos corruptos.</p>';
        }
      });
    }

    // Borrar contraseña
    function deletePassword(index) {
      if (confirm('¿Estás seguro de que quieres borrar esta contraseña?')) {
        let vault = JSON.parse(localStorage.getItem('myVault')) || [];
        vault.splice(index, 1);
        localStorage.setItem('myVault', JSON.stringify(vault));
        loadPasswords();
      }
    }

    // 📥 EXPORTAR COPIA DE SEGURIDAD
    function exportBackup() {
      let vault = localStorage.getItem('myVault');
      
      if (!vault || JSON.parse(vault).length === 0) {
        alert('No hay contraseñas guardadas para exportar.');
        return;
      }

      // Crear un archivo descargable JSON con los datos cifrados
      const blob = new Blob([vault], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_passwords_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 📤 IMPORTAR COPIA DE SEGURIDAD
    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedVault = JSON.parse(e.target.result);
          
          if (!Array.isArray(importedVault)) {
            throw new Error('Formato inválido');
          }

          if (confirm('¿Deseas restaurar esta copia de seguridad? Reemplazará o agregará los datos actuales.')) {
            localStorage.setItem('myVault', JSON.stringify(importedVault));
            alert('¡Copia de seguridad restaurada con éxito!');
            loadPasswords();
          }
        } catch (err) {
          alert('El archivo seleccionado no es válido o está corrupto.');
        }
      };
      reader.readAsText(file);
    }
  </script>

  <!-- Registro del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
